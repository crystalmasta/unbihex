name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Install Tauri dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Test engine
        run: cargo test --locked --all-features --manifest-path unbihex-engine/Cargo.toml
      - name: Test client workspace
        run: cargo test --locked --workspace --all-features --manifest-path unbihex-client/Cargo.toml
      - name: Test server
        run: cargo test --locked --manifest-path test_server/Cargo.toml
      - name: Check UI imports
        run: node unbihex-client/app/ui/tools/check-imports.mjs
      - name: Test the UI
        working-directory: unbihex-client
        run: node --test
