name: macOS ARM64 build
on:
  pull_request:
    paths:
      - 'unbihex-client/**'
      - 'unbihex-engine/**'
      - 'LICENSE*'
      - '.github/workflows/macos.yml'
  push:
    branches: [main, code/macos-build]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # GitHub-hosted macos-15 is an Apple Silicon runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-darwin
          rustup override set 1.99.1
      - name: Test client core
        working-directory: unbihex-client
        run: cargo test --locked -p unbihex-client-core
      - name: Build and package
        run: unbihex-client/installer/build-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unbihex-macos-arm64
          path: unbihex-client/dist/macos-arm64/
          if-no-files-found: error
