name: macOS ARM64 build
on:
  pull_request:
    paths:
      - 'unbihex-client/**'
      - 'unbihex-engine/**'
      - 'LICENSE*'
      - '.github/workflows/macos.yml'
  push:
    branches: [main, code/macos-build]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # GitHub-hosted macos-15 is an Apple Silicon runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26'
      - name: Install Rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-darwin
          rustup override set 1.99.1
      - name: Test client core
        working-directory: unbihex-client
        run: cargo test --locked -p unbihex-client-core
      - name: Build and package
        run: unbihex-client/installer/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Unbihex-macos-arm64
          path: unbihex-client/dist/macos-arm64/
          if-no-files-found: error
