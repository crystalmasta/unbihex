# An unsigned iOS build: proves that the app and the PacketTunnel extension compile.
# The .ipa cannot be installed without signing; see the commented block below.
name: iOS build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/ios']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '26'
      - name: Prepare Rust, Tauri CLI and xcodegen
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-ios
          rustup override set 1.99.1
          # Keep in step with the `tauri` crate in unbihex-client/Cargo.lock (as macos.yml and android.yml).
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-package-lock --no-audit --no-fund --ignore-scripts @tauri-apps/cli@2.11.4
          # The generated Xcode build phase invokes `cargo tauri ios xcode-script`.
          mkdir -p "$RUNNER_TEMP/tauri-bin"
          cat > "$RUNNER_TEMP/tauri-bin/cargo-tauri" <<'SH'
          #!/bin/sh
          if [ "$1" = tauri ]; then shift; fi
          exec "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" "$@"
          SH
          chmod +x "$RUNNER_TEMP/tauri-bin/cargo-tauri"
          echo "$RUNNER_TEMP/tauri-bin" >> "$GITHUB_PATH"
          command -v xcodegen || brew install xcodegen
          echo "VERSION=$(node -p 'require("./unbihex-client/app/src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Generate the Xcode project
        working-directory: unbihex-client/app/src-tauri
        run: cargo tauri ios init --ci
      - name: Build libunbihex.a and add the PacketTunnel target
        working-directory: unbihex-client
        run: |
          sh ios/PacketTunnel/build-ffi.sh ios
          ruby ios/add-packet-tunnel.rb
      - name: Archive without signing
        working-directory: unbihex-client/app/src-tauri/gen/apple
        run: |
          PROJECT="$(ls -d ./*.xcodeproj | head -n 1)"
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild archive \
            -project "$PROJECT" -scheme "$IOS_APP_TARGET" -configuration release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Unbihex.xcarchive" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1; then
            grep -nE 'error:|\*\* ' "$LOG" | head -n 80 || true
            tail -n 200 "$LOG"
            exit 1
          fi
          grep -E '\*\* ' "$LOG"
      - name: Package the unsigned .ipa
        run: |
          APP="$(find "$RUNNER_TEMP/Unbihex.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "$APP"
          test -d "$APP/PlugIns/PacketTunnel.appex" || { echo 'PacketTunnel.appex is not embedded' >&2; exit 1; }
          lipo -archs "$APP/PlugIns/PacketTunnel.appex/PacketTunnel"
          OUT="$GITHUB_WORKSPACE/unbihex-client/dist/ios"
          IPA="Unbihex-$VERSION-ios-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$OUT"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP")"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$OUT/$IPA" Payload)
          (cd "$OUT" && shasum -a 256 "$IPA" > SHA256SUMS.txt && ls -l)

      # --- Signing and TestFlight (needs an Apple Developer account; not used yet) ---
      # Secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_APP_BASE64, IOS_PROFILE_TUNNEL_BASE64,
      # APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (App Store Connect API key).
      # Both profiles need the Network Extensions (Packet Tunnel) capability:
