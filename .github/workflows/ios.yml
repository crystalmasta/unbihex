      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Unbihex-ios-unsigned
          path: unbihex-client/dist/ios/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: failure()
        with:
          name: ios-build-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/xcodebuild.log
            unbihex-client/app/src-tauri/gen/apple/project.yml
