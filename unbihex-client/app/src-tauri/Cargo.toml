[package]
name = "unbihex-client"
description = "Unbihex VPN client (desktop, Android, iOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
default-run = "unbihex-client"

[lib]
# The suffix keeps the lib name distinct from the bin name on Windows.
name = "unbihex_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the UI and serves it over the tauri:// protocol (what `cargo tauri build` turns on).
# On by default so a plain `cargo build --release` gives a working app too.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unbihex-client-core.workspace = true
tauri-plugin-unbihex-vpn.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
