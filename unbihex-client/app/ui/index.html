<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unbihex</title>
  <link rel="stylesheet" href="app/styles.css" />
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Разделы">
      <div class="brand">
        <!-- icon.svg: the app icon, written by src-tauri/icons/source/make-icon.py -->
        <img src="icon.svg" class="logo" alt="" />
        <span>Unbihex</span>
      </div>
      <button class="nav-btn active" data-view="home"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>Главная</span></button>
      <button class="nav-btn" data-view="servers"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg><span>Серверы</span></button>
      <button class="nav-btn" data-view="subs"><svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg><span>Подписки</span></button>
      <button class="nav-btn" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Настройки</span></button>
      <button class="nav-btn" data-view="logs"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Журнал</span></button>
    </nav>

    <main class="main">
      <!-- Главная -->
      <section class="view active" id="view-home">
        <div class="home">
          <div class="connect-card" id="connect-card" data-state="off">
            <button class="power" id="power" aria-label="Подключить">
              <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
            </button>
            <div class="status-text" id="status-text">Не подключено</div>
            <div class="status-sub" id="status-sub">Нажмите, чтобы подключиться</div>
            <button class="server-chip" id="server-chip" data-goto="servers">
              <span class="chip-label">Сервер</span>
              <span class="chip-name" id="chip-name">не выбран</span>
              <svg viewBox="0 0 24 24" class="chev"><path d="M9 6l6 6-6 6"/></svg>
            </button>
            <div class="stats" id="stats" hidden>
              <div class="stat"><span class="stat-k">↑ отдача</span><span class="stat-v" id="st-up">0 Б/с</span><span class="stat-t" id="st-up-t">0 Б</span></div>
              <div class="stat"><span class="stat-k">↓ загрузка</span><span class="stat-v" id="st-down">0 Б/с</span><span class="stat-t" id="st-down-t">0 Б</span></div>
              <div class="stat"><span class="stat-k">напрямую</span><span class="stat-v" id="st-direct">0 Б</span><span class="stat-t">мимо VPN</span></div>
            </div>
          </div>

          <div class="panel" id="mode-panel">
            <div class="panel-title">Как пускать трафик</div>
            <div class="segmented" id="mode-seg" role="radiogroup">
              <button data-mode="system_proxy">Системный прокси</button>
              <button data-mode="tun">TUN — весь трафик</button>
              <button data-mode="proxy_only">Только порт</button>
            </div>
            <p class="hint" id="mode-hint"></p>
            <div class="warn" id="admin-warn" hidden>
              Для режима TUN нужны права администратора.
              <button class="btn small" id="relaunch-admin">Перезапустить от администратора</button>
            </div>
            <div class="hint" id="store-apps" hidden>
              Приложения из Microsoft Store (WhatsApp, Почта, Xbox и другие) Windows не пускает к системному прокси.
              <button class="btn small" id="store-allow">Разрешить им прокси</button>
              <button class="btn small" id="store-undo">Отменить</button>
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">Маршрутизация</div>
            <div class="segmented" id="routing-seg" role="radiogroup">
              <button data-routing="global">Всё через VPN</button>
              <button data-routing="bypass_ru">Россия напрямую</button>
              <button data-routing="only_listed">Только выбранные сайты</button>
              <button data-routing="blocked_only">Только заблокированные</button>
            </div>
            <p class="hint" id="routing-hint"></p>
          </div>

          <div class="panel" id="template-panel" hidden>
            <label class="panel-title" for="home-template">Серверы автовыбора</label>
            <select id="home-template"></select>
            <p class="hint" id="template-hint"></p>
          </div>

          <div class="panel" id="quota-panel" hidden></div>
        </div>
      </section>

      <!-- Серверы -->
      <section class="view" id="view-servers"></section>

      <!-- Подписки -->
      <section class="view" id="view-subs"></section>

      <!-- Настройки -->
      <section class="view" id="view-settings"></section>

      <!-- Журнал -->
      <section class="view" id="view-logs"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="app/index.js"></script>
</body>
</html>
