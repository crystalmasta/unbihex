[package]
name = "unbihex-client-core"
description = "Unbihex client logic: subscriptions, servers, routing presets and engine control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
unbihex-engine.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
base64 = "0.22"
percent-encoding = "2"
url = "2"
ipnet = "2"
parking_lot = "0.12"
# HTTPS for subscriptions: rustls with ring (no cmake/nasm needed on Windows).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
netdev = "0.46"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
