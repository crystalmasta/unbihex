[workspace]
resolver = "3"
members = [
    "crates/client-core",
    "crates/unbihex-ffi",
    "crates/unbihex-cli",
    "plugins/tauri-plugin-unbihex-vpn",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["Crystalmasta (https://github.com/crystalmasta)"]
homepage = "https://github.com/crystalmasta"

[workspace.dependencies]
# The user's own core: Desktop\unbihex-engine, next to this folder.
unbihex-engine = { path = "../unbihex-engine" }
unbihex-client-core = { path = "crates/client-core" }
tauri-plugin-unbihex-vpn = { path = "plugins/tauri-plugin-unbihex-vpn" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# The engine's patched rustls (ClientHello rewriting for the browser TLS fingerprint);
# see ../unbihex-engine/vendor/rustls/UNBIHEX-PATCH.md.
[patch.crates-io]
rustls = { path = "../unbihex-engine/vendor/rustls" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
